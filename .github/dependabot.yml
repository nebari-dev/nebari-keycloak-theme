version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # Group all patch and minor updates into a single PR
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Major updates are not grouped, so each opens its own PR
    ignore:
      # React 18 is required by the Keycloakify / PatternFly admin UI packages.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # These track the Keycloak server version, not semver — bump them by hand.
      - dependency-name: "@keycloakify/*"
      - dependency-name: "@keycloak/keycloak-admin-client"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # Group all GitHub Actions updates into a single PR
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
