version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # The parser and plugin peer-depend on each other, so a lone major bump
      # of either fails npm ci. Listed before patch-and-minor so it wins the
      # first-match group assignment.
      typescript-eslint:
        applies-to: version-updates
        patterns:
          - "@typescript-eslint/*"
      # Group all patch and minor updates into a single PR
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Nearly every dependency here sits under a peer pin from the
      # Keycloakify / PatternFly / Vite stack (PatternFly 5, react-i18next 16,
      # i18next 25, i18next-fetch-backend 6, vite 7, ...), so major bumps
      # fail npm ci with ERESOLVE. Take all majors by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # React 18 is required by the Keycloakify / PatternFly admin UI packages.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # These track the Keycloak server version, not semver — bump them by hand.
      - dependency-name: "@keycloakify/*"
      - dependency-name: "@keycloak/keycloak-admin-client"
      # @keycloakify/keycloak-ui-shared pins react-hook-form to exactly
      # 7.70.0, so even a minor bump fails npm ci.
      - dependency-name: "react-hook-form"
      # @keycloakify/keycloak-ui-shared pins oidc-spa to ~10.0.x.
      - dependency-name: "oidc-spa"
        update-types: ["version-update:semver-minor"]
      # Still 0.x, so 0.4 -> 0.5 counts as a minor bump, but 0.5 requires
      # eslint 9+ and this repo is on eslint 8. Moves with the eslint major.
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # Group all GitHub Actions updates into a single PR
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
