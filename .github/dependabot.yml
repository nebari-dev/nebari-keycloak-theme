version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # Biome is pinned exactly because a new version can change formatter
      # output. It gets its own pull request, which also has to run
      # `npm run format`. Listed before patch-and-minor so it wins the
      # first-match group assignment.
      biome:
        applies-to: version-updates
        patterns:
          - "@biomejs/biome"
      # axe is pinned exactly because a new release adds rules, which can fail
      # the accessibility suites without a code change. Its own pull request
      # shows what the new rules find. Listed before patch-and-minor.
      axe:
        applies-to: version-updates
        patterns:
          - "axe-core"
          - "@axe-core/playwright"
      # Group all patch and minor updates into a single PR
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Nearly every dependency here sits under a peer pin from the
      # Keycloakify / PatternFly / Vite stack (PatternFly 5, react-i18next 16,
      # i18next 25, i18next-fetch-backend 6, vite 7, ...), so major bumps
      # fail npm ci with ERESOLVE. Take all majors by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # React 18 is required by the Keycloakify / PatternFly admin UI packages.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # These track the Keycloak server version, not semver — bump them by hand.
      - dependency-name: "@keycloakify/*"
      - dependency-name: "@keycloak/keycloak-admin-client"
      # @keycloakify/keycloak-ui-shared pins react-hook-form to exactly
      # 7.70.0, so even a minor bump fails npm ci.
      - dependency-name: "react-hook-form"
      # @keycloakify/keycloak-ui-shared pins oidc-spa to ~10.0.x.
      - dependency-name: "oidc-spa"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # Group all GitHub Actions updates into a single PR
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  # The Keycloak base image in the Dockerfile. The Keycloak version is also the
  # server the published image runs, so review each bump against
  # docs/adr/0005-run-the-server-ahead-of-the-console-sources.md.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
