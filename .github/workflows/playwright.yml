name: Playwright tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes an in-flight pull-request run for the same ref. Runs
# on main always finish, so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The theme owns files `keycloakify sync-extensions` will not refresh, so
      # upstream changes to them go missing silently. These guards turn that
      # into a build error. They are not type errors, hence their own step.
      - name: Theme guards
        run: npm run check

      # Playwright transpiles without type checking, so the visual tests alone
      # would not catch a broken build.
      - name: Type check
        run: npm run typecheck

      # The CI form of `npm run lint`: lint and format, failing on warnings,
      # without writing anything.
      - name: Lint and format check
        run: npx biome ci --error-on-warnings .

      - run: npx playwright install --with-deps chromium

      # Gate: compares against the committed baselines in tests/screenshots.
      # A failure here means the theme's rendering changed.
      - name: Compare against baselines
        run: npm run test:screenshots

      # WCAG 2.2 AA scans and keyboard checks of every login page, in every
      # theme. Known, tracked violations are listed in
      # tests/a11y/known-violations.ts; anything else fails here. It runs even
      # when the screenshots differ, and writes to its own report and results
      # folders: every Playwright run empties test-results/ and rewrites
      # playwright-report/, which would replace the screenshot diff.
      - name: Accessibility (login pages)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-a11y
        run: npm run test:a11y -- --output=test-results-a11y

      - name: Upload accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-a11y
          path: |
            playwright-report-a11y
            test-results-a11y
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload diff report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      # Always re-render so reviewers get the screenshots this branch actually
      # produces, whether or not they match the baselines.
      - name: Render current screenshots
        if: always()
        env:
          PLAYWRIGHT_CAPTURE_CURRENT: "1"
        run: npm run test:screenshots:update

      - name: Summarise changed screenshots
        if: always()
        run: |
          {
            echo "### Theme screenshots"
            echo
            if [ ! -d theme-screenshots/linux ]; then
              echo "Screenshot capture failed; inspect the Playwright logs."
            elif diff -qr tests/screenshots/linux theme-screenshots/linux > /tmp/screenshot-diff.txt; then
              echo "Rendered output matches the committed baselines."
            else
              echo "Rendered output differs from the committed baselines:"
              echo
              echo '```'
              cat /tmp/screenshot-diff.txt
              echo '```'
              echo
              echo "Run \`npm run test:screenshots:update\` on Linux and commit the result."
            fi
            echo
            echo "Download the **theme-screenshots** artifact to view them."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: theme-screenshots
          path: theme-screenshots
          if-no-files-found: error
          retention-days: 14

  # The Admin and Account consoles only run inside Keycloak, so this job builds
  # the theme JARs, starts the compose loop and runs the console accessibility
  # suites against it (playwright.consoles.config.ts): every screen in every
  # theme, in both colour schemes.
  consoles:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      # keycloakify shells out to Maven to assemble the JARs; the runner ships
      # Maven but needs Java 17+. See publish-keycloak-image.yml.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci

      - name: Build Keycloak themes
        run: npm run build-keycloak-theme

      - name: Start Keycloak
        run: docker compose up -d --build keycloak

      # Waits for the seeded realm rather than the compose healthcheck: the
      # realm existing means the import has finished.
      - name: Wait for Keycloak
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/realms/nebari/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not come up within 5 minutes."
          docker compose logs keycloak | tail -n 200
          exit 1

      - run: npx playwright install --with-deps chromium

      - name: Accessibility (Admin and Account consoles)
        run: npm run test:a11y:consoles

      - name: Keycloak logs
        if: failure()
        run: docker compose logs keycloak | tail -n 300

      - name: Upload console report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-consoles
          path: |
            playwright-report-consoles
            test-results-consoles
          if-no-files-found: ignore
          retention-days: 14
