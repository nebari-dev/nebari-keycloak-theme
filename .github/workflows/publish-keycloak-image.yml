name: Publish Keycloak theme

# Pull requests build the JARs and the image for both architectures without
# pushing anything, so a broken build shows up before merge. Pushes to main
# publish quay.io/nebari/nebari-keycloak-theme, and cut a GitHub release when
# the version in package.json has none yet.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: quay.io
  IMAGE_NAME: nebari/nebari-keycloak-theme
  # TEMPORARY: the Collab theme keeps its existing GHCR image until it is
  # removed from themes.json. See the collab-image job.
  COLLAB_IMAGE: ghcr.io/${{ github.repository_owner }}/collab-keycloak-theme

# A newer push supersedes a pull-request run, but a publish is never cancelled
# midway: a half-pushed image or release is worse than a queued one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jars:
    name: Build theme JARs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      # Only main publishes. A manual run on any other branch builds and stops.
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      release-exists: ${{ steps.release.outputs.exists }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      # keycloakify shells out to Maven to assemble the theme JARs. No Maven
      # cache: setup-java errors when no pom.xml exists at checkout time, and
      # this repo only gets one generated during the keycloakify build.
      - name: Set up Java and Maven
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Read theme version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The image is republished on every push to main, but a release, and the
      # image's version tag with it, is cut only for a version that does not
      # have one yet. That keeps `:<version>` pointing at one commit for good.
      - name: Check whether the release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists, so no new release or version tag will be published. Bump \"version\" in package.json to cut one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Produces one JAR per theme for each supported Keycloak version range.
      # Each JAR carries exactly one theme; the build script verifies that.
      - name: Build Keycloak themes
        run: npm run build-keycloak-theme

      - name: Upload theme JARs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: keycloak-themes-${{ steps.version.outputs.version }}
          path: dist_keycloak/*.jar
          if-no-files-found: error

  image:
    name: Image (${{ matrix.arch }})
    needs: jars
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # The Dockerfile copies the JARs from dist_keycloak/, so the image is
      # built from the exact JARs the release ships. Its default THEME_JAR glob
      # installs every theme left in that directory.
      - name: Download theme JARs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: keycloak-themes-${{ needs.jars.outputs.version }}
          path: dist_keycloak

      # TEMPORARY: Collab is not a Nebari theme and must not ship in the Nebari
      # image. It keeps its own GHCR image (the collab-image job) until it is
      # removed from themes.json; delete this step with it.
      - name: Keep the Collab theme out of the Nebari image
        run: |
          rm -f dist_keycloak/collab-keycloak-theme-*.jar
          if compgen -G "dist_keycloak/collab-*" > /dev/null; then
            echo "::error::Collab JARs are still in the build context"
            exit 1
          fi
          ls dist_keycloak

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # No continue-on-error: on main a failed login must fail the run, not
      # quietly skip the publish.
      - name: Log in to Quay.io
        if: needs.jars.outputs.publish == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Generate image labels
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=nebari-keycloak-theme
            org.opencontainers.image.description=Keycloak with the Nebari Keycloak themes installed

      # Each architecture is pushed by digest only; the manifest job below
      # joins them under the real tags. Pull requests build without pushing.
      - name: Build image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          provenance: false
          outputs: ${{ needs.jars.outputs.publish == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=cacheonly' }}

      - name: Export digest
        if: needs.jars.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.jars.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # TEMPORARY: publishes the Collab theme to its existing GHCR package with the
  # same tags as before, so Collab deployments are unaffected while Collab moves
  # to its own repository. Remove this job, COLLAB_IMAGE and the Collab lines in
  # the release notes when the Collab theme leaves themes.json.
  collab-image:
    name: Collab image (temporary, GHCR)
    needs: jars
    if: needs.jars.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download theme JARs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: keycloak-themes-${{ needs.jars.outputs.version }}
          path: dist_keycloak

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # The `org.opencontainers.image.source` label this sets links the package
      # to this repository, which is what lets GITHUB_TOKEN push to it.
      - name: Generate Collab image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.COLLAB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.jars.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and publish Collab image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: true
          build-args: |
            THEME_JAR=collab-keycloak-theme-for-kc-all-other-versions.jar
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  manifest:
    name: Publish multi-arch manifest
    needs: [jars, image]
    if: needs.jars.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      # `latest` and `sha-<commit>` on every publish. The version tag only
      # alongside a new release, so it never moves once published.
      - name: Create and push manifest list
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.jars.outputs.version }}
          NEW_RELEASE: ${{ needs.jars.outputs.release-exists == 'false' }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(--tag "$IMAGE:latest" --tag "$IMAGE:sha-${GITHUB_SHA::7}")
          if [ "$NEW_RELEASE" = "true" ]; then
            tags+=(--tag "$IMAGE:$VERSION")
          fi
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"

  release:
    name: Cut GitHub release
    needs: [jars, manifest, collab-image]
    if: needs.jars.outputs.publish == 'true' && needs.jars.outputs.release-exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # For themes.json, which lists the themes the notes describe.
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download theme JARs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: keycloak-themes-${{ needs.jars.outputs.version }}
          path: dist_keycloak

      # The only release assets are the JARs; that is all a consumer needs. The
      # notes carry no screenshots: docs/screenshots.md shows them, linked here
      # at the release commit.
      - name: Compose release notes
        env:
          SCREENSHOTS: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/screenshots.md
          VERSION: ${{ needs.jars.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          {
            echo "## Nebari Keycloak themes $VERSION"
            echo
            echo "See [what the theme looks like]($SCREENSHOTS) in this release."
            echo
            echo "### Install a theme"
            echo
            echo "Download the JAR matching your Keycloak version, drop it into Keycloak's"
            echo "\`providers/\` directory and run \`bin/kc.sh build\`:"
            echo
            echo "| Theme | Keycloak version | Asset |"
            echo "| --- | --- | --- |"
            for theme in $(jq -r '.[]' themes.json); do
              echo "| \`$theme\` | 26 and newer | \`$theme-keycloak-theme-for-kc-all-other-versions.jar\` |"
              echo "| \`$theme\` | 22 to 25 | \`$theme-keycloak-theme-for-kc-22-to-25.jar\` |"
            done
            echo
            echo "Then set that theme as the login, account and admin theme under"
            echo "**Realm settings -> Themes**."
            echo
            echo "### Or use the prebuilt image"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION             # nebari"
            # TEMPORARY: until the Collab theme leaves themes.json.
            echo "docker pull $COLLAB_IMAGE:$VERSION  # collab"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.jars.outputs.tag }}
          VERSION: ${{ needs.jars.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "Nebari Keycloak themes $VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            dist_keycloak/*.jar
