name: Publish Keycloak theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The Collab theme is published as its own package, so a Collab deployment
  # pulls an image that carries only the `collab` theme.
  COLLAB_IMAGE_NAME: ${{ github.repository_owner }}/collab-keycloak-theme

# Never cancel a publish midway — a half-pushed image or release is worse than
# a queued one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # keycloakify shells out to Maven to assemble the theme JARs. No Maven
      # cache: setup-java@v6 errors when no pom.xml exists at checkout time,
      # and this repo only gets one generated during the keycloakify build.
      - name: Set up Java and Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Read theme version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The image is republished on every push to main, but a release is cut only
      # for a version that does not have one yet. Without this, every commit to
      # main would try to reuse the same tag and fail.
      - name: Check whether the release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${{ steps.version.outputs.tag }} already exists, so no new release will be cut. Bump \"version\" in package.json to publish one. The container image is still being updated."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Produces separate Nebari and Collab JARs for each supported Keycloak
      # version range. Each JAR carries exactly one theme — the build script
      # verifies that — so each image below can install just its own.
      - name: Build Keycloak themes
        run: npm run build-keycloak-theme

      # Keep the JARs downloadable on every main-branch run, including commits
      # that intentionally reuse the current release version.
      - name: Publish Nebari JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: nebari-keycloak-theme-${{ steps.version.outputs.version }}
          path: dist_keycloak/nebari-keycloak-theme-*.jar
          if-no-files-found: error

      - name: Publish Collab JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: collab-keycloak-theme-${{ steps.version.outputs.version }}
          path: dist_keycloak/collab-keycloak-theme-*.jar
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Nebari image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and publish Nebari image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            KEYCLOAK_VERSION=26.5.0
            THEME_JAR=nebari-keycloak-theme-for-kc-all-other-versions.jar
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      # The `org.opencontainers.image.source` label this sets links the package
      # to this repository, which is what lets GITHUB_TOKEN create and push it.
      - name: Generate Collab image metadata
        id: collab-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.COLLAB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and publish Collab image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            KEYCLOAK_VERSION=26.5.0
            THEME_JAR=collab-keycloak-theme-for-kc-all-other-versions.jar
          tags: ${{ steps.collab-metadata.outputs.tags }}
          labels: ${{ steps.collab-metadata.outputs.labels }}

      # The only release assets are the JARs — that is all a consumer needs. The
      # screenshots are referenced from this commit rather than attached, so the
      # release page shows what the theme looks like without adding weight to
      # it. They are the images the Playwright workflow gates on every pull
      # request.
      #
      # Inline images require the repository to be public: raw.githubusercontent
      # does not accept browser session cookies, and GitHub proxies external
      # images server-side without the viewer's credentials. The link below the
      # table keeps the notes useful while the repository is private.
      - name: Compose release notes
        if: steps.release.outputs.exists == 'false'
        env:
          RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/screenshots/linux
          TREE: https://github.com/${{ github.repository }}/tree/${{ github.sha }}/tests/screenshots/linux
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          COLLAB_IMAGE: ${{ env.REGISTRY }}/${{ env.COLLAB_IMAGE_NAME }}
        run: |
          {
            echo "## Nebari and Collab Keycloak themes $VERSION"
            echo
            echo "| Nebari | Collab |"
            echo "| --- | --- |"
            echo "| <img src=\"$RAW/nebari/full-page-light.png\" width=\"320\"> | <img src=\"$RAW/collab/full-page-light.png\" width=\"320\"> |"
            echo
            echo "[Browse every login page screenshot for this release]($TREE)"
            # One collapsible gallery per theme, from its baseline directory.
            for dir in tests/screenshots/linux/*/; do
              theme="$(basename "$dir")"
              echo
              echo "<details><summary>All $theme login pages</summary>"
              echo
              for shot in "$dir"*.png; do
                name="$(basename "$shot" .png)"
                case "$name" in
                  full-page-*) continue ;;
                esac
                echo "<img src=\"$RAW/$theme/$name.png\" width=\"280\" alt=\"$theme $name\">"
              done
              echo
              echo "</details>"
            done
            echo
            echo "### Install the theme"
            echo
            echo "Download the JAR matching your theme and server, drop it into Keycloak's"
            echo "\`providers/\` directory and run \`bin/kc.sh build\`:"
            echo
            echo "| Theme | Keycloak version | Asset |"
            echo "| --- | --- | --- |"
            echo "| Nebari | 26 and newer | \`nebari-keycloak-theme-for-kc-all-other-versions.jar\` |"
            echo "| Nebari | 22 to 25 | \`nebari-keycloak-theme-for-kc-22-to-25.jar\` |"
            echo "| Collab | 26 and newer | \`collab-keycloak-theme-for-kc-all-other-versions.jar\` |"
            echo "| Collab | 22 to 25 | \`collab-keycloak-theme-for-kc-22-to-25.jar\` |"
            echo
            echo "Then select **nebari** or **collab** as the login, account and admin theme for your realm."
            echo
            echo "### Or use the prebuilt image"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION         # Nebari"
            echo "docker pull $COLLAB_IMAGE:$VERSION  # Collab"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Nebari and Collab Keycloak themes ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" \
            dist_keycloak/*.jar
