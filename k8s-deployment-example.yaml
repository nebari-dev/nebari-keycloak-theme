apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # The theme JAR is about 12 MB, too large for a ConfigMap. An init
      # container copies it out of the theme image instead. See "Deployment" in
      # README.md.
      imagePullSecrets:
      - name: ghcr-creds
      initContainers:
      - name: install-keycloak-theme
        image: ghcr.io/nebari-dev/nebari-keycloak-theme:1.1.0
        command: ["sh", "-c", "cp /opt/keycloak/providers/*.jar /theme-providers/"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: theme-providers
          mountPath: /theme-providers
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.5.0
        # Plain `start`, not `--optimized`, so Keycloak rebuilds with the theme.
        args:
          - start
          - --hostname-strict=false
          - --http-enabled=true
          - --proxy-headers=xforwarded
        env:
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: admin
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin
              key: password
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://postgres:5432/keycloak
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-db
              key: username
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-db
              key: password
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: management
          containerPort: 9000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: theme-providers
          mountPath: /opt/keycloak/providers
      volumes:
      - name: theme-providers
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: default
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 8443
    targetPort: 8443
    protocol: TCP
  selector:
    app: keycloak
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - keycloak.example.com
    secretName: keycloak-tls
  rules:
  - host: keycloak.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
---
# Secrets (create separately)
# kubectl create secret generic keycloak-admin --from-literal=password=<admin-password>
# kubectl create secret docker-registry ghcr-creds --docker-server=ghcr.io --docker-username=<github-user> --docker-password=<token-with-read:packages>
# kubectl create secret generic keycloak-db --from-literal=username=<db-user> --from-literal=password=<db-password>
