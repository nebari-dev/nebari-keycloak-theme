# A child of the Nebari theme. Keycloak resolves templates, resources and
# messages here first, then falls back to the parent.
parent=nebari
# Stamped on <html> as data-brand, so collab.css can scope its rules to this brand.
brand=collab
# Loaded after the Nebari theme's own CSS, relative to this theme's resources.
styles=css/collab.css
