# A child of the Nebari theme. Keycloak resolves templates, resources and
# messages here first, then falls back to the parent.
parent=nebari
# Read by the Nebari theme: stamped on <html> as data-brand, so the
# stylesheet below can scope its rules to this brand.
brand=acme
# Loaded after the Nebari theme's own CSS, relative to this theme's resources.
styles=css/acme.css
# Login strings this theme overrides in messages/. The Nebari login pages bundle
# their text, so each overridden key has to be listed here to take effect.
messageOverrides=loginAccountTitle registerTitle
